services:
  api_react_condominio:
    build:
      context: ./ReactAspNetCoreCondominio
      dockerfile: CondominioSaaSReact.API/Dockerfile
    container_name: api_react_condominio
    restart: unless-stopped
    ports:
      - "5002:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ApplicationDbContext: >
        Server=sqlserver2022,1433;
        Database=Condominio_aspnet_react;
        User Id=sa;
        Password=Senh@Forte2026!;
        Encrypt=False;
        TrustServerCertificate=True;
        MultipleActiveResultSets=true
      Jwt__Key: wedaf7d4563b48e197b1507d492b708eSuperSecretKey2026
      Jwt__Issuer: Condominio.API
      Jwt__Audience: Condominio.API
      Jwt__ExpireMinutes: 15
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: guest
      RabbitMq__Password: guest
      RabbitMq__ExchangeNameReact: email_exchange_react
      RabbitMq__QueueNameReact: fila_emails_react
      RabbitMq__DeadLetterQueueReact: fila_emails_erro_react
      RabbitMq__DeadLetterExchangeReact: dlx_exchange_react
      AdminSettings__UserName: Admin
      AdminSettings__Email: emailadmin@gmail.com
      AdminSettings__Password: 12345
      Security__EncryptionKey: MinhaChaveDeCriptografiaSuperSecreta
      Cors__AllowedOrigins: http://localhost:3000,https://localhost:300,http://condominio_front_react:3000
      Logging__LogLevel__Default: Information
      Logging__LogLevel__Microsoft: Warning
    volumes:
      - ./keys:/home/app/.aspnet/DataProtection-Keys
    networks:
      - infra_net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8081/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker_react_condominio:
    build:
      context: ./ReactAspNetCoreCondominio
      dockerfile: CondominioSaaSReact.Worker/Dockerfile
    container_name: worker_react_condominio
    restart: unless-stopped
    ports:
      - "5003:8082"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: guest
      RabbitMq__Password: guest
      RabbitMq__Port: 5672
      RabbitMq__ExchangeNameReact: email_exchange_react
      RabbitMq__QueueNameReact: fila_emails_react
      RabbitMq__DeadLetterExchangeReact: dlx_exchange_react
      RabbitMq__DeadLetterQueueReact: fila_emails_erro_react
    depends_on:
      api_react_condominio:
        condition: service_healthy
    networks:
      - infra_net

  front_react_condominio:
    build:
      context: ./react_condominio
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /backend
    container_name: front_react_condominio
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      NODE_ENV: production
    depends_on:
      api_react_condominio:
        condition: service_healthy
    networks:
      - infra_net

networks:
  infra_net:
    external: true
    name: infra_net
    driver: bridge